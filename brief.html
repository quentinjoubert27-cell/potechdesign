<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur de Brief — Po Tech Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f3ef;
      --text: #1a1a18;
      --muted: #9a9790;
      --border: #e2dfd8;
      --accent: #b5926a;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'DM Sans', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      overflow: hidden;
    }

    /* ── PROGRESS ── */
    .progress-bar {
      position: fixed;
      top: 0; left: 0;
      height: 1.5px;
      background: var(--text);
      width: 0%;
      transition: width 0.7s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100;
    }

    /* ── NAV ── */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.75rem 3rem;
      z-index: 50;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: var(--text);
    }

    .nav-logo img { height: 26px; width: auto; }

    .nav-logo-text {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .nav-counter {
      font-family: var(--sans);
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.05em;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .nav-counter.visible { opacity: 1; }

    .nav-close {
      font-family: var(--sans);
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .nav-close:hover { color: var(--text); }

    /* ── VIEWPORT ── */
    .viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    /* ── SLIDE ── */
    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 12vw;
      will-change: transform, opacity;
      /* position initiale : en dessous, invisible */
      opacity: 0;
      transform: translateY(60px);
      pointer-events: none;
    }

    /* ── INTRO ── */
    #slide-intro {
      gap: 0;
    }

    .intro-label {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2.5rem;
    }

    .intro-title {
      font-family: var(--serif);
      font-size: clamp(3.5rem, 7vw, 7rem);
      font-weight: 300;
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin-bottom: 2rem;
    }

    .intro-title em { font-style: italic; color: var(--accent); }

    .intro-desc {
      font-family: var(--sans);
      font-size: 1rem;
      color: var(--muted);
      line-height: 1.75;
      max-width: 420px;
      margin-bottom: 3.5rem;
    }

    /* ── QUESTION ── */
    #slide-question {
      gap: 0;
    }

    .q-label {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 3rem;
    }

    .q-text {
      font-family: var(--serif);
      font-size: clamp(2.2rem, 4.5vw, 5rem);
      font-weight: 300;
      line-height: 1.15;
      letter-spacing: -0.015em;
      color: var(--text);
      max-width: 820px;
      margin-bottom: 3.5rem;
    }

    .q-text em { font-style: italic; color: var(--accent); }

    .q-input-wrap {
      max-width: 580px;
      margin-bottom: 2.5rem;
      position: relative;
    }

    .q-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 0;
      padding-right: 3rem;
      font-family: var(--serif);
      font-size: clamp(1.25rem, 2vw, 1.75rem);
      font-weight: 300;
      color: var(--text);
      outline: none;
      transition: border-color 0.3s;
      caret-color: var(--accent);
    }

    .q-input:focus { border-color: var(--text); }
    .q-input::placeholder { color: var(--border); }

    .q-submit-inline {
      position: absolute;
      right: 0;
      bottom: 0.6rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 1.1rem;
      transition: color 0.2s, transform 0.2s;
      line-height: 1;
      padding: 0.25rem;
    }
    .q-submit-inline:hover { color: var(--text); transform: translateX(3px); }

    .q-hint {
      font-family: var(--sans);
      font-size: 12px;
      color: var(--muted);
    }
    .q-hint kbd {
      font-family: var(--sans);
      font-size: 11px;
      background: var(--border);
      padding: 0.15em 0.45em;
      border-radius: 2px;
    }

    /* ── LOADING ── */
    #slide-loading {
      align-items: flex-start;
    }

    .loading-wrap {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .loading-text {
      font-family: var(--serif);
      font-size: clamp(1.5rem, 3vw, 3rem);
      font-weight: 300;
      color: var(--muted);
      font-style: italic;
    }

    .loading-dots {
      display: flex;
      gap: 10px;
    }

    .loading-dots span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text);
      animation: ldot 1.4s ease infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.18s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.36s; }

    @keyframes ldot {
      0%, 60%, 100% { opacity: 0.12; transform: scale(0.7); }
      30% { opacity: 1; transform: scale(1); }
    }

    /* ── BRIEF FINAL ── */
    #slide-brief {
      overflow-y: auto;
      justify-content: flex-start;
      padding-top: 8rem;
      padding-bottom: 5rem;
    }

    .brief-label {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .brief-title {
      font-family: var(--serif);
      font-size: clamp(2.5rem, 5vw, 5rem);
      font-weight: 300;
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin-bottom: 4rem;
    }

    .brief-title em { font-style: italic; color: var(--accent); }

    .brief-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      max-width: 760px;
      border-top: 1px solid var(--border);
      margin-bottom: 3rem;
    }

    .brief-item {
      padding: 1.4rem 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .brief-item:nth-child(odd) { padding-right: 3rem; }
    .brief-item:nth-child(even) {
      padding-left: 3rem;
      border-left: 1px solid var(--border);
    }

    .brief-item-label {
      font-family: var(--sans);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .brief-item-value {
      font-family: var(--serif);
      font-size: 1.1rem;
      font-weight: 300;
      color: var(--text);
      line-height: 1.5;
    }

    .brief-resume {
      max-width: 760px;
      padding: 2rem 0;
      border-top: 1px solid var(--border);
      margin-bottom: 3rem;
    }

    .brief-resume .brief-item-label { margin-bottom: 0.75rem; }

    .brief-resume p {
      font-family: var(--serif);
      font-size: 1.2rem;
      font-weight: 300;
      line-height: 1.75;
      color: var(--text);
    }

    .brief-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.9rem 2rem;
      font-family: var(--sans);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: opacity 0.2s, background 0.2s, color 0.2s;
      letter-spacing: 0.02em;
    }

    .btn-dark {
      background: var(--text);
      color: var(--bg);
    }
    .btn-dark:hover { opacity: 0.8; }

    .btn-outline {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover { border-color: var(--text); }

    @media (max-width: 640px) {
      .slide { padding: 0 6vw; }
      .brief-grid { grid-template-columns: 1fr; }
      .brief-item:nth-child(even) { padding-left: 0; border-left: none; }
      .brief-item:nth-child(odd) { padding-right: 0; }
      .nav { padding: 1.25rem 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="progress-bar" id="progress-bar"></div>

  <nav class="nav">
    <a href="index.html" class="nav-logo">
      <img src="assets/img/logo.png" alt="Po Tech Design">
      <span class="nav-logo-text">Po Tech Design</span>
    </a>
    <div class="nav-right">
      <span class="nav-counter" id="nav-counter"></span>
      <a href="index.html" class="nav-close">Quitter</a>
    </div>
  </nav>

  <div class="viewport">

    <!-- INTRO -->
    <div class="slide" id="slide-intro">
      <p class="intro-label">Générateur de brief</p>
      <h1 class="intro-title">Parlons de<br>votre <em>projet.</em></h1>
      <p class="intro-desc">Je vais vous poser quelques questions pour construire un brief précis. Comptez 5 à 10 minutes.</p>
      <div>
        <button class="btn btn-dark" id="btn-start">Commencer →</button>
      </div>
    </div>

    <!-- QUESTION -->
    <div class="slide" id="slide-question">
      <p class="q-label" id="q-label">Question 1</p>
      <p class="q-text" id="q-text"></p>
      <div class="q-input-wrap">
        <input class="q-input" id="q-input" type="text" placeholder="Votre réponse…" autocomplete="off">
        <button class="q-submit-inline" id="btn-inline-send" aria-label="Envoyer">→</button>
      </div>
      <p class="q-hint">Appuyez sur <kbd>Entrée</kbd> pour continuer</p>
    </div>

    <!-- LOADING -->
    <div class="slide" id="slide-loading">
      <div class="loading-wrap">
        <p class="loading-text">Analyse en cours…</p>
        <div class="loading-dots"><span></span><span></span><span></span></div>
      </div>
    </div>

    <!-- BRIEF -->
    <div class="slide" id="slide-brief">
      <p class="brief-label">Votre brief</p>
      <h2 class="brief-title">Votre projet<br><em>en un coup d'œil.</em></h2>
      <div class="brief-grid" id="brief-grid"></div>
      <div class="brief-resume" id="brief-resume"></div>
      <div class="brief-actions">
        <a href="contact.html" class="btn btn-dark">Envoyer ce brief →</a>
        <button class="btn btn-outline" id="btn-copy">Copier</button>
        <button class="btn btn-outline" id="btn-restart">Recommencer</button>
      </div>
    </div>

  </div>

  <script>
    const API_URL = 'https://halston-api.vercel.app/api/brief';

    const slides = {
      intro:    document.getElementById('slide-intro'),
      question: document.getElementById('slide-question'),
      loading:  document.getElementById('slide-loading'),
      brief:    document.getElementById('slide-brief'),
    };

    const progressBar  = document.getElementById('progress-bar');
    const navCounter   = document.getElementById('nav-counter');
    const qLabel       = document.getElementById('q-label');
    const qText        = document.getElementById('q-text');
    const qInput       = document.getElementById('q-input');

    let history = [];
    let questionCount = 0;
    let current = 'intro';

    // ── Init : affiche l'intro directement ──
    function show(el) {
      el.style.transition = 'none';
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
      el.style.pointerEvents = 'all';
    }
    function hide(el) {
      el.style.transition = 'none';
      el.style.opacity = '0';
      el.style.transform = 'translateY(60px)';
      el.style.pointerEvents = 'none';
    }
    // Init
    show(slides.intro);

    // ── Transitions ──
    function goTo(name) {
      if (current === name) return;
      const prev = slides[current];
      const next = slides[name];
      current = name;

      // Sortie : monte et disparaît
      prev.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
      prev.style.opacity = '0';
      prev.style.transform = 'translateY(-40px)';
      prev.style.pointerEvents = 'none';

      // Positionne le suivant en bas, sans transition
      next.style.transition = 'none';
      next.style.opacity = '0';
      next.style.transform = 'translateY(60px)';
      next.style.pointerEvents = 'none';

      // Force reflow puis anime l'entrée
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          next.style.transition = 'opacity 0.55s ease, transform 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
          next.style.opacity = '1';
          next.style.transform = 'translateY(0)';
          next.style.pointerEvents = 'all';
        });
      });
    }

    function setProgress(pct) {
      progressBar.style.width = `${Math.min(pct, 100)}%`;
    }

    function parseMarkdown(t) {
      return t
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>');
    }

    function parseBrief(text) {
      const m = text.match(/---BRIEF---([\s\S]*?)---FIN BRIEF---/);
      if (!m) return null;
      const fields = [];
      m[1].trim().split('\n').forEach(line => {
        const r = line.match(/\*\*(.+?)\s*:\*\*\s*(.+)/);
        if (r) fields.push({ label: r[1].trim(), value: r[2].trim() });
      });
      return fields;
    }

    function renderBrief(fields) {
      const grid   = document.getElementById('brief-grid');
      const resume = document.getElementById('brief-resume');
      grid.innerHTML = '';
      resume.innerHTML = '';

      fields.forEach(f => {
        if (f.label === 'Résumé') {
          resume.innerHTML = `
            <p class="brief-item-label">Résumé</p>
            <p>${f.value}</p>`;
        } else {
          const d = document.createElement('div');
          d.className = 'brief-item';
          d.innerHTML = `
            <span class="brief-item-label">${f.label}</span>
            <span class="brief-item-value">${f.value}</span>`;
          grid.appendChild(d);
        }
      });

      // Construire le texte du brief pour le pré-remplissage
      const briefText = fields.map(f => `${f.label} : ${f.value}`).join('\n');
      window._briefText = briefText;

      // Mettre à jour le lien "Envoyer ce brief"
      const sendLink = document.querySelector('.brief-actions a.btn');
      if (sendLink) {
        sendLink.href = 'contact.html?brief=' + encodeURIComponent(briefText);
      }

      setProgress(100);
      navCounter.classList.remove('visible');
      goTo('brief');
    }

    function showQuestion(reply) {
      questionCount++;
      const pct = Math.min((questionCount / 15) * 88, 88);
      setProgress(pct);
      navCounter.textContent = `${questionCount}`;
      navCounter.classList.add('visible');
      qLabel.textContent = `Question ${questionCount}`;
      qText.innerHTML = parseMarkdown(reply);
      qInput.value = '';
      goTo('question');
      setTimeout(() => qInput.focus(), 700);
    }

    async function sendMessage(userText) {
      history.push({ role: 'user', content: userText });
      goTo('loading');

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        const reply = data.reply;
        history.push({ role: 'assistant', content: reply });

        const brief = parseBrief(reply);
        if (brief) {
          renderBrief(brief);
        } else {
          showQuestion(reply);
        }
      } catch {
        showQuestion('Une erreur est survenue. Voulez-vous réessayer ?');
      }
    }

    async function start() {
      goTo('loading');
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: [{ role: 'user', content: 'Commence.' }] }),
        });
        const data = await res.json();
        history.push({ role: 'assistant', content: data.reply });
        showQuestion(data.reply);
      } catch {
        goTo('intro');
      }
    }

    function handleSend() {
      const val = qInput.value.trim();
      if (!val) return;
      sendMessage(val);
    }

    // ── Events ──
    document.getElementById('btn-start').addEventListener('click', start);
    document.getElementById('btn-inline-send').addEventListener('click', handleSend);

    qInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); handleSend(); }
    });

    document.getElementById('btn-copy').addEventListener('click', () => {
      const lines = [...document.querySelectorAll('.brief-item')].map(el =>
        `${el.querySelector('.brief-item-label').textContent} : ${el.querySelector('.brief-item-value').textContent}`
      );
      const res = document.querySelector('#brief-resume p:last-child')?.textContent;
      if (res) lines.push(`Résumé : ${res}`);
      navigator.clipboard.writeText(lines.join('\n')).then(() => {
        const btn = document.getElementById('btn-copy');
        btn.textContent = 'Copié !';
        setTimeout(() => btn.textContent = 'Copier', 2000);
      });
    });

    document.getElementById('btn-restart').addEventListener('click', () => {
      history = [];
      questionCount = 0;
      setProgress(0);
      navCounter.classList.remove('visible');
      goTo('intro');
    });
  </script>
</body>
</html>
